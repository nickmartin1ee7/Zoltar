name: CI/CD

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  mobile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Install MAUI Workloads
        run: |
          dotnet workload install maui-android android --ignore-failed-sources

      - name: Run Unit Tests
        run: dotnet test ./Zoltar.Tests/Zoltar.Tests.csproj

      - name: Inject Azure App Configuration connection string
        shell: pwsh
        run: |
          $appSettingsPath = Resolve-Path ./Zoltar/Resources/appsettings.json
          $appSettings = Get-Content $appSettingsPath -Raw | ConvertFrom-Json
          $appSettings.ConnectionStrings.aac = "${{ secrets.aac }}"
          ($appSettings | ConvertTo-Json -Depth 10) | Set-Content $appSettingsPath

      - name: Set Android version
        shell: pwsh
        run: |
          $csprojPath = Resolve-Path ./Zoltar/Zoltar.csproj
          $versionName = "${{ vars.APP_VERSION }}.${{ github.run_number }}"
          $versionCode  = "${{ github.run_number }}"

          $content = Get-Content $csprojPath
          $content = $content -replace "<ApplicationDisplayVersion>\d+\.\d+</ApplicationDisplayVersion>", "<ApplicationDisplayVersion>$versionName</ApplicationDisplayVersion>"
          $content = $content -replace "<ApplicationVersion>\d+</ApplicationVersion>", "<ApplicationVersion>$versionCode</ApplicationVersion>"
          $content | Set-Content $csprojPath

      - name: Decode release keystore
        shell: pwsh
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [IO.File]::WriteAllBytes("$env:GITHUB_WORKSPACE/Zoltar/release.keystore", [Convert]::FromBase64String($env:KEYSTORE_B64))

      - name: Publish
        run: >-
          dotnet publish ./Zoltar/Zoltar.csproj -f net10.0-android -c Release -o release
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore=release.keystore
          -p:AndroidSigningKeyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          -p:AndroidSigningStorePass=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          -p:AndroidSigningKeyPass=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zoltar-apk
          path: "release/*-Signed.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ vars.APP_VERSION }}.${{ github.run_number }}"
          name: Zoltar v${{ vars.APP_VERSION }}.${{ github.run_number }}
          draft: false
          prerelease: false
          files: "release/*-Signed.apk"
          generate_release_notes: true
